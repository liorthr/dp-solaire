<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Les étapes d'une déclaration préalable de travaux</title>
  <desc id="d">Frise chronologique : préparer le dossier, déposer en mairie, récépissé, instruction d'un mois (deux mois en général en secteur protégé), décision ou non-opposition tacite, affichage sur le terrain et recours des tiers pendant deux mois, travaux à commencer dans les trois ans, déclaration d'achèvement.</desc>
  <rect width="960" height="420" rx="24" fill="#faf6ee"/>
  <text x="40" y="52" font-size="24" font-weight="800" fill="#13201a">Déclaration préalable : les étapes</text>
  <text x="40" y="78" font-size="14" fill="#5d6b63">Source : service-public.fr (F17578), notice officielle du cerfa 16702</text>
  <line x1="70" y1="190" x2="890" y2="190" stroke="#1f6b4a" stroke-width="4" stroke-linecap="round"/>
  <g font-size="13" fill="#13201a" text-anchor="middle">
    <g transform="translate(90 190)"><circle r="18" fill="#1f6b4a"/><text y="5" fill="#fff" font-weight="800">1</text><text y="-34" font-weight="700">Préparer</text><text y="40">cerfa 16702</text><text y="58">+ pièces DP1…</text></g>
    <g transform="translate(225 190)"><circle r="18" fill="#1f6b4a"/><text y="5" fill="#fff" font-weight="800">2</text><text y="-34" font-weight="700">Déposer</text><text y="40">en ligne, courrier</text><text y="58">ou en mairie</text></g>
    <g transform="translate(360 190)"><circle r="18" fill="#1f6b4a"/><text y="5" fill="#fff" font-weight="800">3</text><text y="-34" font-weight="700">Récépissé</text><text y="40">numéro et date</text><text y="58">de dépôt</text></g>
    <g transform="translate(495 190)"><circle r="18" fill="#ffb84d"/><text y="5" font-weight="800">4</text><text y="-34" font-weight="700">Instruction</text><text y="40">1 mois</text><text y="58">2 mois en général</text><text y="76">en secteur protégé</text></g>
    <g transform="translate(630 190)"><circle r="18" fill="#1f6b4a"/><text y="5" fill="#fff" font-weight="800">5</text><text y="-34" font-weight="700">Décision</text><text y="40">ou non-opposition</text><text y="58">tacite</text></g>
    <g transform="translate(765 190)"><circle r="18" fill="#1f6b4a"/><text y="5" fill="#fff" font-weight="800">6</text><text y="-34" font-weight="700">Affichage</text><text y="40">panneau sur le terrain</text><text y="58">recours : 2 mois</text></g>
    <g transform="translate(880 190)"><circle r="18" fill="#13201a"/><text y="5" fill="#fff" font-weight="800">7</text><text y="-34" font-weight="700">Travaux</text><text y="40">sous 3 ans</text><text y="58">puis DAACT</text></g>
  </g>
  <rect x="40" y="318" width="880" height="70" rx="16" fill="#fff" stroke="#e6e0d4"/>
  <text x="60" y="346" font-size="14" fill="#13201a"><tspan font-weight="700">Dossier incomplet ?</tspan> La mairie le signale dans le mois ; vous avez 3 mois pour compléter,</text>
  <text x="60" y="368" font-size="14" fill="#13201a">et le délai d'instruction repart à la réception des pièces manquantes.</text>
  <text x="920" y="408" font-size="11" fill="#5d6b63" text-anchor="end">Schéma explicatif Permizy, non officiel</text>
</svg>
